# Local development stack for the back end. Run these from server/:
#   make up      PostgreSQL, Mailpit, Prometheus and Grafana only
#   make dev     make up, then the server on your machine with `go run` (no image build)
#   make start   everything in Docker, including the production server image, then a smoke check
#   make down    stop everything (data is kept in volumes)
#
# Ports on the host:
#   8080  API                    9090  Server metrics (raw Prometheus format)
#   3000  Grafana dashboards     9091  Prometheus UI
#   5433  PostgreSQL             8025  Mailpit web UI (every email the server sends lands here)
#   1025  Mailpit SMTP
name: pm-dev

services:
  # Only started by `make start` (profile "app"); with `make dev` the server runs on the host.
  server:
    profiles: [app]
    build:
      context: ../server
      target: runtime
      args:
        VERSION: dev
    environment:
      PM_ENV: development
      PM_HTTP_ADDR: ":8080"
      PM_METRICS_ADDR: ":9090"
      PM_LOG_LEVEL: debug
      PM_DATABASE_URL: postgres://pm:pm-dev-only@postgres:5432/pm?sslmode=disable
      PM_SMTP_HOST: mailpit
      PM_SMTP_PORT: "1025"
      PM_SMTP_FROM: Password Manager <vault@pm.localhost>
      PM_SMTP_TLS: none
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm-dev-only
      POSTGRES_DB: pm
    ports:
      - "5433:5432"
    volumes:
      - pm-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "8025:8025"
      - "1025:1025"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pm-prometheus:/prometheus
    # Lets Prometheus reach a server started with `make dev` on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # Dev only: anyone on localhost can view; sign in as admin / pm-dev-only to edit.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: pm-dev-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pm-server.json
      # No calls home (OPS-08).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - pm-grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pm-dev-db:
  pm-prometheus:
  pm-grafana:
